image:
  repository: ghcr.io/digilolnet/netcup-failover-controller
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

podAnnotations: {}

# Node selector and tolerations for the controller pods themselves.
# Defaults to control-plane nodes, which is recommended since the controller
# needs to survive worker node failures.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# Spread the replicas across nodes so a single node failure cannot take out
# both controller pods.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: netcup-failover-controller

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

# Namespace for the controller and its ServiceAccount.
# NetcupFailoverIP resources are cluster-scoped and can be created in any namespace.
namespace: netcup-system

# Whether to create the namespace.
createNamespace: true

# Whether to install the CRD. Set to false if you manage CRDs separately.
installCRD: true

# Restrict the controller's pod traffic: egress DNS + TCP 443/6443 only,
# ingress health probes only. No-op without a NetworkPolicy-enforcing CNI.
networkPolicy:
  enabled: true

# Deny kubelets changing their own node's netcup.digilol.net/server-name
# annotation (ValidatingAdmissionPolicy, requires Kubernetes 1.30+). Disable
# on older clusters.
nodeAnnotationProtection:
  enabled: true

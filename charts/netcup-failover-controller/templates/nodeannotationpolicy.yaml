{{- if .Values.nodeAnnotationProtection.enabled }}
# Kubelets may modify their own Node's annotations (the NodeRestriction
# admission plugin does not cover annotations), so a compromised node could
# rewrite netcup.digilol.net/server-name and hijack failover IP routing to a
# different server in the account. This policy denies node users changing the
# annotation; admins remain unaffected. Requires Kubernetes 1.30+.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "netcup-failover-controller.name" . }}-protect-server-name
  labels:
    {{- include "netcup-failover-controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: request-from-node
      expression: request.userInfo.groups.exists(g, g == 'system:nodes')
  validations:
    - expression: >-
        object.metadata.?annotations['netcup.digilol.net/server-name'].orValue('') ==
        oldObject.metadata.?annotations['netcup.digilol.net/server-name'].orValue('')
      message: nodes may not change their own netcup.digilol.net/server-name annotation
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "netcup-failover-controller.name" . }}-protect-server-name
  labels:
    {{- include "netcup-failover-controller.labels" . | nindent 4 }}
spec:
  policyName: {{ include "netcup-failover-controller.name" . }}-protect-server-name
  validationActions: [Deny]
{{- end }}

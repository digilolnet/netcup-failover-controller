{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "netcup-failover-controller.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "netcup-failover-controller.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "netcup-failover-controller.selectorLabels" . | nindent 6 }}
{{- end }}

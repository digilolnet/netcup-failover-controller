apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcup-failover-controller
  namespace: netcup-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netcup-failover-controller
  template:
    metadata:
      labels:
        app: netcup-failover-controller
    spec:
      serviceAccountName: netcup-failover-controller
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: netcup-failover-controller
      containers:
        - name: manager
          image: ghcr.io/digilolnet/netcup-failover-controller:latest
          env:
            # Only credentialsSecret references in this namespace are accepted;
            # must match the namespace of the controller's secrets Role.
            - name: CREDENTIALS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi

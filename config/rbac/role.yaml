apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netcup-failover-controller
rules:
  - apiGroups: [netcup.digilol.net]
    resources: [netcupfailoverips]
    verbs: [get, list, watch]
  - apiGroups: [netcup.digilol.net]
    resources: [netcupfailoverips/status]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
# Events about NetcupFailoverIP resources. Events on cluster-scoped objects
# are stored in the default namespace, so the grant is a Role there instead
# of cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netcup-failover-controller-events
  namespace: default
rules:
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netcup-failover-controller-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netcup-failover-controller-events
subjects:
  - kind: ServiceAccount
    name: netcup-failover-controller
    namespace: netcup-system

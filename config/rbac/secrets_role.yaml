# Secret access is deliberately namespaced, not cluster-wide: the controller
# only reads/writes credentials Secrets in its own namespace, and the
# reconciler rejects credentialsSecret references pointing anywhere else
# (CREDENTIALS_NAMESPACE). A compromised controller therefore cannot read or
# overwrite Secrets of other workloads.
#
# get:    read the OAuth token
# update: persist refreshed OAuth tokens back to the Secret
# create: `/manager login` run in-cluster (kubectl exec) bootstraps the Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netcup-failover-controller-secrets
  namespace: netcup-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netcup-failover-controller-secrets
  namespace: netcup-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netcup-failover-controller-secrets
subjects:
  - kind: ServiceAccount
    name: netcup-failover-controller
    namespace: netcup-system

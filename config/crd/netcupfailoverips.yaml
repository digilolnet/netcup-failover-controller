apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netcupfailoverips.netcup.digilol.net
spec:
  group: netcup.digilol.net
  names:
    kind: NetcupFailoverIP
    listKind: NetcupFailoverIPList
    plural: netcupfailoverips
    singular: netcupfailoverip
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.currentNode
        - name: Routed
          type: string
          jsonPath: .status.conditions[?(@.type=="Routed")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [ips, credentialsSecret]
              properties:
                credentialsSecret:
                  type: object
                  description: |
                    Names the Secret containing the netcup SCP API credentials. The
                    Secret always lives in the controller's own namespace and must
                    have a "token" key holding the OAuth2 token JSON; seed it with
                    `netcup-failover-controller login`.
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                ips:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    description: A failover IP in CIDR notation (e.g. 198.51.100.1/32 or 2001:db8::/64).
                    pattern: '^[0-9a-fA-F:.]+/[0-9]{1,3}$'
                nodeSelector:
                  type: object
                  description: |
                    Restricts eligible nodes using standard Kubernetes label selector syntax.
                    Supports matchLabels and matchExpressions.
                  x-kubernetes-map-type: atomic
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        required: [key, operator]
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
            status:
              type: object
              properties:
                currentNode:
                  type: string
                  description: |
                    The node the IPs are routed to. While the Routed condition is
                    False it names the node currently being routed to.
                conditions:
                  type: array
                  description: Standard Kubernetes conditions; the controller reports a single "Routed" condition.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0

# Do not create this Secret by hand — the login subcommand creates it via the
# OAuth2 device flow (open the printed URL, log in, done):
#
#   kubectl exec -it -n netcup-system deploy/netcup-failover-controller -- /manager login
#
# or locally: netcup-failover-controller login --secret netcup-system/netcup-credentials
#
# Alternatively seed it from the token file written by `netcup-scp auth login`:
#
#   kubectl create secret generic netcup-credentials -n netcup-system \
#     --from-file=token=$HOME/.config/netcup-scp/token.json
#
# The controller keeps the token fresh by writing refreshed tokens back into
# this Secret. The example below only documents the expected shape.
apiVersion: v1
kind: Secret
metadata:
  name: netcup-credentials
  namespace: netcup-system
stringData:
  token: |
    {"access_token":"…","refresh_token":"…","expires_in":300,"obtained_at":"2026-08-29T00:00:00Z"}
